[package]
name = "hyprforge-lock"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An ext-session-lock-v1 lock screen for Hyprland, authenticating against PAM and sharing its look with the greeter."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-lock"
readme = "README.md"
keywords = ["hyprland", "wayland", "lock-screen", "pam", "linux"]
categories = ["gui", "os::linux-apis", "authentication"]

[[bin]]
name = "hyprforge-lock"
path = "src/main.rs"

[dependencies]
# Named as git dependencies, not versions, because the owner has not
# published to crates.io yet: this manifest has to work unchanged both
# inside the Hyprforge workspace and as the root of its own standalone
# repository once `git subtree split` pulls it out. Inside the
# workspace, the root Cargo.toml's `[patch]` section redirects these
# straight back to the local `crates/` directories, so nothing here
# touches the network; standalone, cargo fetches them from git.
hyprforge-authui = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-paths = { git = "https://github.com/adamrpostjr/hyprforge" }
hyprforge-look = { git = "https://github.com/adamrpostjr/hyprforge" }
# default-features off drops softbuffer: this paints into the buffer the
# compositor hands over, so it has no use for a windowing backend.
iced_tiny_skia = { version = "0.14", default-features = false, features = ["image"] }
iced_runtime = "0.14"
iced_widget = { version = "0.14", features = ["image"] }
tiny-skia = "0.11"
# default-features = false: no serde, no oldtime, no wasm bindings — a
# lock screen wants the smallest thing that can format a strftime string.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# iced_graphics enables the `image` crate with no format features at
# all, so without this there is no PNG decoder and every wallpaper
# fails to load. Cargo unifies features across the dependency graph, so
# declaring the formats here is what switches them on for iced.
#
# The full list, matching the workspace root's, and it must keep
# matching — `check.sh`'s "Standalone crate dependency pins" step fails
# the build when it drifts, which is how this line got written.
#
# Worth being clear about what that costs a lock screen, since it is the
# one process on the machine that must not fail: nothing, in any build
# that happens here. Feature unification means this crate *already*
# links every decoder the root asks for whenever it is built inside the
# workspace. This list only describes the standalone repository's build,
# so keeping it in sync is what makes that build the same as the one
# that was actually tested — and a wallpaper somebody saved as a .webp
# is a real thing to be handed.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "tiff",
    "bmp",
    "ico",
    "tga",
    "qoi",
    "pnm",
    "hdr",
    "exr",
    "ff",
] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# Versions pinned to whatever smithay-client-toolkit 0.20 already pulls
# in. The Wayland source and the ping have to come from the *same*
# calloop as the toolkit's, or the event loop can't hold both.
calloop = "0.14"
calloop-wayland-source = "0.4"
pam-client2 = "0.5"
# Run zbus on tokio rather than its default async-io executor. For the
# logind LockedHint only. A current-thread runtime on a detached
# thread, never the event loop: see src/logind.rs.
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "rt"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
