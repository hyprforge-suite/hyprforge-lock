# Pinned because CI's clippy step demands clippy be *silent*
# (`cargo clippy --all-targets -- -D warnings`, see
# .github/workflows/ci.yml), and clippy's lint set changes between
# releases: a floating `stable` can turn a clean tree into a failing one
# without a line of this crate's code changing, and the failure then
# looks like a regression in whatever was last touched.
#
# This is a copy of the pin the monorepo carries at its root — kept in
# step by hand, since this repository is the component's directory
# alone (a submodule there) and the root's file is not in it. Raise it
# deliberately, alongside the same version in the main repository.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
